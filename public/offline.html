<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — One St. Peter</title>
    <!--
      Plain HTML on purpose: this is what the service worker serves when a
      navigation fails, so it must render without any of the app's JS.
    -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1a1a1a;
        background: #ffffff;
      }
      img { width: 96px; height: 96px; }
      h1 { margin: 0; font-size: 1.25rem; }
      p { margin: 0; max-width: 32ch; color: #5c5c5c; line-height: 1.5; }
      button {
        margin-top: 8px;
        padding: 10px 24px;
        font: inherit;
        font-weight: 600;
        color: #ffffff;
        background: #109448;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>One St. Peter needs a connection to load this page. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </body>
</html>
